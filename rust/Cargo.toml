[package]
name = "codex-keyboard"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
serde_json = "=1.0.118"
libc = "=0.2.171"
chrono = { version = "=0.4.41", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
